<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahan Tutor - 2.5 Latest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f3ff;height:100vh;display:flex;flex-direction:column}
.header{background:white;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{width:40px;height:40px;background:#6366f1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.6}
.user{align-self:flex-start;background:#6366f1;color:white}
.bot{align-self:flex-end;background:white;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;gap:8px}
.avatar{width:28px;height:28px;background:#6366f1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px}
.input-area{background:white;padding:12px;display:flex;gap:8px;border-top:1px solid #e5e7eb}
#userInput{flex:1;padding:12px 16px;border:1px solid #e5e7eb;border-radius:24px;outline:none}
.sendBtn{width:44px;height:44px;background:#6366f1;border:none;border-radius:50%;color:white;cursor:pointer;font-size:18px}
.settings{padding:12px;background:#fffbeb;border-bottom:1px solid #fde68a;display:none}
.settings.show{display:block}
.settings input{width:100%;margin-top:8px;direction:ltr;padding:10px;border-radius:8px;border:1px solid #e5e7eb}
</style>
</head>
<body>
<div class="header"><div class="logo">A</div><div><b>Ahan Tutor</b><div style="font-size:12px;color:#10b981">● Gemini 2.5 Flash - Latest 2026</div></div></div>
<div id="settingsBox" class="settings">
<b>🔑 API Key ڈالیں</b><br><small>aistudio.google.com/app/apikey</small>
<input id="apiKeyInput" placeholder="AIzaSy...">
<button onclick="saveKey()" style="width:100%;border-radius:8px;margin-top:8px;height:40px;background:#10b981;color:white;border:none;font-weight:bold">Save Key</button>
</div>
<div id="chat" class="chat"><div class="msg bot"><div class="avatar">A</div><div>السلام علیکم برار! اب میں Gemini 2.5 Flash پر ہوں - 2026 کا سب سے نیا ماڈل! اب چیک کرو 🔥</div></div></div>
<div class="input-area"><input id="userInput" placeholder="Yahan sawal likho..." onkeypress="if(event.key==='Enter')send()"><button class="sendBtn" onclick="send()">➤</button></div>
<script>
let apiKey = localStorage.getItem('gemini_key') || '';
if(!apiKey) document.getElementById('settingsBox').classList.add('show');
function saveKey(){let k=document.getElementById('apiKeyInput').value.trim();if(k.length>20){localStorage.setItem('gemini_key',k);apiKey=k;document.getElementById('settingsBox').classList.remove('show');alert('Key save ho gayi!');}else{alert('Sahi Key dalo');}}
async function send(){
 let input=document.getElementById('userInput');let text=input.value.trim();if(!text) return;
 if(!apiKey){alert('Pehle Key dalo');document.getElementById('settingsBox').classList.add('show');return;}
 let chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg user">${text}</div>`;input.value='';chat.scrollTop=chat.scrollHeight;
 let botDiv=document.createElement('div');botDiv.className='msg bot';botDiv.innerHTML=`<div class="avatar">A</div><div>سوچ رہا ہوں...</div>`;chat.appendChild(botDiv);
 chat.scrollTop=chat.scrollHeight;
 try{
   // LATEST MODEL 2026 - VERIFIED
   let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({contents:[{parts:[{text:text}]}]})
   });
   let data=await res.json();
   console.log(data);
   if(data.error){botDiv.innerHTML=`<div class="avatar">A</div><div>Error: ${data.error.message}<br><br>Key naya banao: aistudio.google.com/app/apikey</div>`;return;}
   let reply=data.candidates?.[0]?.content?.parts?.[0]?.text || 'Jawab nahi mila';
   botDiv.innerHTML=`<div class="avatar">A</div><div>${reply.replace(/\n/g,'<br>')}</div>`;
 }catch(e){botDiv.innerHTML=`<div class="avatar">A</div><div>Network Error: ${e.message}</div>`;}
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
